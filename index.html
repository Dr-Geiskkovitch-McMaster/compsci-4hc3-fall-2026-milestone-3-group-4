<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/main.css">

    <script type="importmap">
        {
            "imports": {
                "@material/web/": "https://esm.run/@material/web/"
            }
        }
    </script>

    <!-- Components from the @material/web UI library -->
    <script type="module">
        import '@material/web/all.js';
    </script>

</head>
<body>

    <header class="top-nav-bar">
        <!-- Menu for secondary tasks -->
        <md-icon-button class="nav-button">
            <md-icon>menu</md-icon>
        </md-icon-button>
        
        <!-- Search bar -->
        <md-filled-text-field 
        type="search"
        placeholder="Search Notes"
        class="filled-search-bar">
        <md-icon slot="trailing-icon">search</md-icon>
        </md-filled-text-field>

        <!-- Avatar icon for Google Account connection -->
        <div class="avatar-icon">
            <span class="avatar-initial">A</span>
        </div>

    </header>

    <!-- Browse/View all notes view -->
    <main id="browse-view" class="app-view" style="display: none;">
        <div class="card-list">
            <button type="button" class="m3-card">
                <md-ripple></md-ripple>
                <div class="card-content">
                    <div class="card-icon-circle">
                        <md-icon aria-hidden="true">format_list_bulleted</md-icon>
                    </div>
                    <span class="card-title">View All</span>
                </div>
                <div class="card-stats">
                    <div class="card-stat">
                        <span id="browse-view-all-open" class="card-stat-value">0</span>
                        <span class="card-stat-label">open</span>
                    </div>
                    <div class="card-stat">
                        <span id="browse-view-all-total" class="card-stat-value card-stat-value--muted">0</span>
                        <span class="card-stat-label">total</span>
                    </div>
                </div>
            </button>
            <details open class="browse-section">
                <summary class="m3-card-hr">
                    <md-icon aria-hidden="true">filter_list</md-icon>
                    <span class="m3-card-hr-subtitle">Filters</span>
                    <md-icon class="browse-section-chevron" aria-hidden="true">expand_more</md-icon>
                </summary>
                <div id="browse-filters-list" class="card-list"></div>
            </details>
            <details open class="browse-section">
                <summary class="m3-card-hr">
                    <md-icon aria-hidden="true">sell</md-icon>
                    <span class="m3-card-hr-subtitle">Tags</span>
                    <md-icon class="browse-section-chevron" aria-hidden="true">expand_more</md-icon>
                </summary>
                <div id="browse-tags-list" class="card-list"></div>
            </details>
        </div>
    </main>

    <!-- Agenda/create notes view -->
    <main id="agenda-view" class="app-view">

        <section class="section-group">
            <md-divider inset></md-divider>
            <h1 class="title-label-small">Today</h1>
            
            <md-divider inset></md-divider>
            <h1 class="title-label-small">Tomorrow</h1>
        </section>
    </main>

    <!-- Review view -->
    <main id="review-view" class="app-view" style="display: none;">
        <p>Review Notes</p>
    </main>

    <!-- Navigation bar to switch views -->
    <nav class="bottom-nav-bar">
        
        <button class="nav-item" data-target="browse-view">
                <md-icon>list</md-icon>
                <span class="nav-label">Browse</span>
        </button>
        
        <button class="nav-item active" data-target="agenda-view">
             <md-icon>calendar_today</md-icon>
            <span class="nav-label">Agenda</span>
        </button>

        <button class="nav-item" data-target="review-view">
             <md-icon>inbox</md-icon>
            <span class="nav-label">Review</span>
        </button>

    </nav>

    <script type="module" src="js/main.js"></script>
</body>
</html>
