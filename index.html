<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda</title>


    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css">

    <!-- Google Icons (to match Material 3 UI) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <!-- Define the import map -->
    <script type="importmap">
        {
            "imports": {
                "@material/web/": "https://esm.run/@material/web/"
            }
        }
    </script>

    <!-- Importing components from the @material/web UI Library -->
     <script type="module">
        
     </script>

</head>
<body>

    <main id="browse-view" class="app-view" style="display: none;">
        <p>Browse Notes</p>
    </main>

    <main id="agenda-view" class="app-view">
        <p>Agenda</p>
    </main>

    <main id="review-view" class="app-view" style="display: none;">
        <p>Review Notes</p>
    </main>

    <nav class="bottom-nav-bar">
        
        <button class="nav-item" data-target="browse-view">
                <span class="material-symbols-outlined nav-icon">list</span>
                <span class="nav-label">Browse</span>
        </button>
        
        <button class="nav-item active" data-target="agenda-view">
            <span class="material-symbols-outlined nav-icon">calendar_today</span>
            <span class="nav-label">Agenda</span>
        </button>

        <button class="nav-item" data-target="review-view">
            <span class="material-symbols-outlined nav-icon">inbox</span>
            <span class="nav-label">Review</span>
        </button>

    </nav>

    <!--Javascript-->
    <script type="module" src="js/main.js"></script>
</body>
</html>
