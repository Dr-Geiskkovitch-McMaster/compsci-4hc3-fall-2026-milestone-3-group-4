<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <link rel="stylesheet" href="css/main.css">

    <script type="importmap">
        {
            "imports": {
                "@material/web/": "https://esm.run/@material/web/"
            }
        }
    </script>

    <!-- Components from the @material/web UI library -->
     <script type="module">
        import '@material/web/all.js';
     </script>

</head>
<body>

    <header class="top-nav-bar">
        <!-- Menu for secondary tasks -->
        <md-icon-button class="nav-button">
            <md-icon>menu</md-icon>
        </md-icon-button>
        
        <!-- Search bar -->
        <md-filled-text-field 
        type="search"
        placeholder="Search Notes"
        class="filled-search-bar">
        <md-icon slot="trailing-icon">search</md-icon>
        </md-filled-text-field>

        <!-- Avatar icon for Google Account connection -->
        <div class="avatar-icon">
            <span class="avatar-initial">A</span>
        </div>

    </header>

    <!-- Browse/View all notes view -->
    <main id="browse-view" class="app-view" style="display: none;">
        <p>Browse Notes</p>
    </main>

    <!-- Agenda/create notes view -->
    <main id="agenda-view" class="app-view">

        <section class="section-group">
            <md-divider inset></md-divider>
            <h1 class="title-label-small">Today</h1>
            
            <md-divider inset></md-divider>
            <h1 class="title-label-small">Tomorrow</h1>
        </section>
    </main>

    <!-- Review view -->
    <main id="review-view" class="app-view" style="display: none;">
        <section id="review-home">
            <hr>
            <label for="review-options">Stacks</label>
            <div class="review-stacks">
                <div class="stack-grid">
                    <button class="layer stack-button" data-stack="new-stack-button">+</button>
                </div>
                <div class="stack-grid">
                    <button class="layer stack-button" data-stack="open">Open Loops</button>
                    <div class="layer layer-2"></div>
                    <div class="layer layer-3"></div>
                </div>
                <div class="stack-grid">
                    <button class="layer stack-button" data-stack="untagged">Untagged</button>
                    <div class="layer layer-2"></div>
                    <div class="layer layer-3"></div>
                </div>
                <div class="stack-grid">
                    <button class="layer stack-button" data-stack="due">Due Soon</button>
                    <div class="layer layer-2"></div>
                    <div class="layer layer-3"></div>
                </div>
            </div>
            <hr>
            <label for="review-options">Tags</label>
            <div class="review-stacks">
                <div class="stack-grid">
                    <button class="layer stack-button" data-stack="school">School</button>
                    <div class="layer layer-2"></div>
                    <div class="layer layer-3"></div>
                </div>
                <div class="stack-grid">
                    <button class="layer stack-button" data-stack="random">Random</button>
                    <div class="layer layer-2"></div>
                    <div class="layer layer-3"></div>
                </div>
                <div class="stack-grid">
                    <button class="layer stack-button" data-stack="home">Home</button>
                    <div class="layer layer-2"></div>
                    <div class="layer layer-3"></div>
                </div>
                <div class="stack-grid">
                    <button class="layer stack-button" data-stack="capstone">Capstone</button>
                    <div class="layer layer-2"></div>
                    <div class="layer layer-3"></div>
                </div>
                <div class="stack-grid">
                    <button class="layer stack-button" data-stack="food">Food</button>
                    <div class="layer layer-2"></div>
                    <div class="layer layer-3"></div>
                </div>
            </div>
        </section>
        
        <section id="active-review" hidden>
            <div class="top-button-review">
                <button id="exit-review" aria-label="Exit review">×</button>
            </div>
            <div class="review-block">
                <label for="review-tag">Review by tag</label>
                <div class="tag-picker">
                    <div class="tag-input-container">
                        <div id="selected-review-tags" class="selected-tags" aria-label="Selected tags"></div>
                        <input
                            id="review-tag"
                            type="search"
                            placeholder="Type or choose a tag"
                            autocomplete="off"
                        >
                    </div>
                    <div id="review-tag-options" class="tag-options" aria-label="Tag suggestions"></div>
                </div>
                <button id="save-stack" hidden>Save Filters as New Stack</button>
                <div class="note-stack">
                    <div class="sticky-note sticky-note--back"></div>
                    <div class="sticky-note sticky-note--front">
                        <p>This is a sample note.</p>
                        <div class="note-tags" aria-label="Note tags"></div>
                    </div>
                </div>
                <p class="review-feedback" aria-live="polite">Swipe the note to review it.</p>
            </div>
        </section>

        <md-dialog id="save-stack-dialog">
            <div slot="headline">Save new stack</div>
            <form slot="content" id="stack-form" method="dialog">
                <label for="stack-name">Stack Name</label>
                <input id="stack-name" type="text">
            </form>
            <div slot="actions">
                <md-text-button form="stack-form" value="cancel">Cancel</md-text-button>
                <md-filled-button form="stack-form" value="save">Save</md-filled-button>
            </div>
        </md-dialog>

        <md-dialog id="reminder-date-set">
            <div slot="headline">Set reminder date</div>
            <form slot="content" id="reminder-form" method="dialog">
                <label for="reminder-time">Reminder date and time</label>
                <input id="reminder-time" type="datetime-local">
            </form>
            <div slot="actions">
                <md-text-button form="reminder-form" value="cancel">Cancel</md-text-button>
                <md-filled-button form="reminder-form" value="save">Save</md-filled-button>
            </div>
        </md-dialog>

    </main>

    <!-- Navigation bar to switch views -->
    <nav class="bottom-nav-bar">
        
        <button class="nav-item" data-target="browse-view">
                <md-icon>list</md-icon>
                <span class="nav-label">Browse</span>
        </button>
        
        <button class="nav-item active" data-target="agenda-view">
             <md-icon>calendar_today</md-icon>
            <span class="nav-label">Agenda</span>
        </button>

        <button class="nav-item" data-target="review-view">
             <md-icon>inbox</md-icon>
            <span class="nav-label">Review</span>
        </button>

    </nav>

    <script type="module" src="js/main.js"></script>
</body>
</html>
